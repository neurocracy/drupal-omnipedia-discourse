services:

  _defaults:
    autowire: true
    autoconfigure: true

  omnipedia_discourse.discourse_config:
    class: Drupal\omnipedia_discourse\Service\DiscourseConfig

  Drupal\omnipedia_discourse\Service\DiscourseConfigInterface: '@omnipedia_discourse.discourse_config'

  omnipedia_discourse.discourse_permalink_resolver:
    class: Drupal\omnipedia_discourse\Service\DiscoursePermalinkResolver

  Drupal\omnipedia_discourse\Service\DiscoursePermalinkResolverInterface: '@omnipedia_discourse.discourse_permalink_resolver'

  omnipedia_discourse.sso_user_data:
    class: Drupal\omnipedia_discourse\Service\SsoUserData
    tags:
      - { name: hooks }

  omnipedia_discourse.sso_maintenance_mode_routing_event_subscriber:
    class: Drupal\omnipedia_discourse\EventSubscriber\Routing\SsoMaintenanceModeRoutingEventSubscriber
    tags:
      - { name: 'event_subscriber' }
